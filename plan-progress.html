<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentic-16s · Plan & Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Plan & progress board. progress/build.py writes the data block (between DATA-START and DATA-END) into this file from
   progress/plan.json plus a scan of the disk. Do not edit that block by hand. */
:root {
  --bg: #f2f3f4; --surface: #ffffff; --surface-2: #e9ebed; --ink: #15181c; --ink-2: #444b54; --muted: #6a717a;
  --line: #d9dde1; --line-strong: #b4bac1; --link: #2d68ad; --focus: #2d68ad;
  --done: #1d6f38; --done-bg: #dcefe1; --prog: #2d68ad; --prog-bg: #d9e5f3; --todo: #5f666e; --todo-bg: #e6e8ea;
  --warn: #875600; --warn-bg: #f6e9cc; --bad: #9c3030; --bad-bg: #f5dede; --code-bg: #eef0f2;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121416; --surface: #1a1d20; --surface-2: #24282c; --ink: #eceef0; --ink-2: #c1c6cc; --muted: #949ba3;
    --line: #31363b; --line-strong: #4a5057; --link: #6ea4e8; --focus: #6ea4e8;
    --done: #72c98a; --done-bg: #1d3324; --prog: #6ea4e8; --prog-bg: #1d3046; --todo: #a9afb6; --todo-bg: #2a2e33;
    --warn: #e8b85a; --warn-bg: #3a2e14; --bad: #f09a9a; --bad-bg: #3f2222; --code-bg: #23272b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121416; --surface: #1a1d20; --surface-2: #24282c; --ink: #eceef0; --ink-2: #c1c6cc; --muted: #949ba3;
  --line: #31363b; --line-strong: #4a5057; --link: #6ea4e8; --focus: #6ea4e8;
  --done: #72c98a; --done-bg: #1d3324; --prog: #6ea4e8; --prog-bg: #1d3046; --todo: #a9afb6; --todo-bg: #2a2e33;
  --warn: #e8b85a; --warn-bg: #3a2e14; --bad: #f09a9a; --bad-bg: #3f2222; --code-bg: #23272b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.mono, code { font-family: var(--f-mono); font-size: .84em; }
code { background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-head); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; padding: 28px 0 18px; }
header.top .t { flex: 1 1 320px; min-width: 0; }
header.top .t p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.built { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: .84rem; color: var(--muted); }
.built .stale { color: var(--warn); font-weight: 500; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .84rem; }
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.tile b { display: block; font-family: var(--f-head); font-size: 1.7rem; font-weight: 700; line-height: 1.15; margin-top: 2px; }
.tile span { color: var(--ink-2); font-size: .86rem; }

section { margin-top: 30px; }
section > h2 { margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* phase rail */
.rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.rail a { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.rail a:hover { border-color: var(--line-strong); }
.rail a.current { border-color: var(--prog); box-shadow: inset 0 0 0 1px var(--prog); }
.rail .pid { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
.rail .pt { font-family: var(--f-head); font-weight: 600; font-size: .92rem; line-height: 1.2; margin: 2px 0 8px; min-height: 2.4em; }
.bar { height: 6px; border-radius: 3px; background: var(--todo-bg); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--done); }
.bar .p { background: var(--prog); }
.rail .frac { font-size: .76rem; color: var(--muted); margin-top: 4px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-done { color: var(--done); background: var(--done-bg); }
.s-in_progress { color: var(--prog); background: var(--prog-bg); }
.s-todo { color: var(--todo); background: var(--todo-bg); }
.s-blocked { color: var(--bad); background: var(--bad-bg); }
.s-needs_human { color: var(--warn); background: var(--warn-bg); }
.live { color: var(--prog); background: var(--prog-bg); }
.live::before { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.tag { font-size: .74rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }

/* needs you */
.needs { list-style: none; margin: 0; padding: 0; }
.needs li { padding: 12px 16px; border-left: 3px solid var(--warn); }
.needs li + li { border-top: 1px solid var(--line); }
.needs b { font-weight: 600; }
.needs p { color: var(--ink-2); font-size: .9rem; max-width: 80ch; }

/* phases */
details.phase { margin-top: 10px; }
details.phase > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 16px; }
details.phase > summary::-webkit-details-marker { display: none; }
details.phase > summary::before { content: "▸"; color: var(--muted); width: 1em; }
details.phase[open] > summary::before { content: "▾"; }
details.phase > summary h3 { flex: 1 1 200px; min-width: 0; }
details.phase > summary .pid { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.phase-body { border-top: 1px solid var(--line); padding: 12px 16px 6px; }
.goal { color: var(--ink-2); font-size: .92rem; max-width: 86ch; }
.plinks { margin-top: 6px; font-size: .86rem; display: flex; gap: 12px; flex-wrap: wrap; }
.task { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 0 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-of-type { margin-top: 12px; }
.task .tid { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); padding-top: 2px; }
.task .head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.task .head b { font-weight: 600; margin-right: 2px; }
.task .note { color: var(--ink-2); font-size: .88rem; margin-top: 3px; max-width: 86ch; }
.files { margin-top: 6px; display: grid; gap: 4px; font-size: .84rem; }
.frow { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.frow .k { color: var(--muted); width: 4.4em; flex: none; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }
.f { font-family: var(--f-mono); font-size: .8rem; word-break: break-all; }
.f.missing { color: var(--muted); }
.f.missing::before { content: "○ "; }
.f.ok::before { content: "● "; color: var(--done); }
.fmeta { color: var(--muted); font-size: .76rem; white-space: nowrap; }
.dset { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.dset a, .dset span { font-family: var(--f-mono); font-size: .72rem; padding: 0 5px; border-radius: 4px; text-decoration: none; line-height: 1.7; }
.dset a { color: var(--done); background: var(--done-bg); }
.dset a:hover { text-decoration: underline; }
.dset span { color: var(--muted); background: var(--todo-bg); }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: right; padding: 7px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; font-family: var(--f-head); font-weight: 600; font-size: .78rem; color: var(--muted); vertical-align: bottom; white-space: normal; line-height: 1.25; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 180px; }
td.dash { color: var(--muted); }
.legend { padding: 10px 16px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 16px; display: flex; gap: 10px; align-items: baseline; font-size: .9rem; }
.list li + li { border-top: 1px solid var(--line); }
.list .when { color: var(--muted); font-size: .76rem; white-space: nowrap; flex: none; width: 6.4em; }
.list .grow { flex: 1; min-width: 0; word-break: break-word; }
footer { margin-top: 36px; color: var(--muted); font-size: .84rem; }
footer p + p { margin-top: 4px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
</style>
</head>

ent, and tables of metrics, per-sample predictions and parameters. Run command in db/README.md.", "outputs": [{"kind": "single", "path": "dashboard/app.py", "exists": true, "size": 24904, "mtime": 1794839618, "is_dir": false}, {"kind": "single", "path": "docs/ml-results.md", "exists": true, "size": 6500, "mtime": 1794835879, "is_dir": false}], "logs": [], "outputs_present": 2, "outputs_total": 2, "status_source": "disk"}, {"id": "6.3", "title": "Docker Compose: PostgreSQL + dashboard", "owner": "agent", "status": "todo", "note": "Packaging for people who clone the repo; one command starts everything. Deferred from Phase 1.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}], "links": []}, {"id": "P7", "title": "Scale out", "goal": "More studies; start the cross-study heterogeneity analysis.", "tasks": [{"id": "7.0", "title": "GCP plan: hybrid Mac + Spot VM, Terraform", "owner": "agent + human", "status": "done", "note": "Written plan only: agents, PostgreSQL and dashboard stay on the Mac; Nextflow runs on a Terraform-managed on-demand VM (e2-standard-8, Docker profile) that is off by default. Credit checked 2026-11-15: $10/month, each grant valid 12 months, Spot excluded. infra/ not created yet.", "outputs": [{"kind": "single", "path": "docs/gcp-migration.md", "exists": true, "size": 38643, "mtime": 1794834123, "is_dir": false}], "logs": [], "outputs_present": 1, "outputs_total": 1, "status_source": "disk"}, {"id": "7.0b", "title": "GCP project and $1 card-cap kill switch (Terraform)", "owner": "agent + human", "note": "Project agentic-16s-gcp on the free-trial billing account. Kill switch applied (23 resources) and tested 2026-11-15: a fake over-budget message unlinked billing within a minute. gcloud runs through infra/gcloud16s (own config folder + the ADC sign-in), because Antigravity's Google extension overwrote the plain gcloud sign-in with another account's credential after every login.", "status": "done", "outp fixed code snapshot, uploads results to GCS and is deleted. Not the per-task google-batch executor: ~4 tasks per run, most seconds long, and the integrity checks need local files. Owner confirms terraform apply.", "outputs": [{"kind": "single", "path": "infra/batch.tf", "exists": true, "size": 3124, "mtime": 1794870132, "is_dir": false}, {"kind": "single", "path": "infra/batch_runner.sh", "exists": true, "size": 5975, "mtime": 1794869883, "is_dir": false}, {"kind": "single", "path": "infra/batch_submit.py", "exists": true, "size": 24555, "mtime": 1794870132, "is_dir": false}, {"kind": "single", "path": "pipeline/bin/compare_tables.py", "exists": true, "size": 5289, "mtime": 1794869909, "is_dir": false}, {"kind": "single", "path": "studies/35756051/pipeline_qc_subset6_batch.json", "exists": false}], "logs": [], "outputs_present": 4, "outputs_total": 5, "status_source": "disk"}, {"id": "7.0e", "title": "Full study on Batch, compared with the GCE VM run (35756051, 89 runs)", "owner": "agent", "status": "todo", "note": "35756051 because its VM run used pseudo denoising, like every new study; 29335008 was pooled, so its ASVs would differ for a reason unrelated to Batch. Expect identical counts, ASVs and genus labels (no species columns now); record wall time and cost against the VM's 1 h 13 min.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}, {"id": "7.1", "title": "Scale to more studies", "owner": "agent", "status": "todo", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}, {"id": "7.2", "title": "Region / batch-effect analysis", "owner": "agent + human", "status": "todo", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}], "links": []}, {"id": "P8", "title": "Testing and CI/CD", "goal": "Every long-tail problem a new study exposes becomes an automatic check: unit and regression tests, a mini end-to-end run, mock-community ittable files); first GitHub run waits for the push.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}, {"id": "8.4", "title": "Failure taxonomy and long-tail regression fixtures (offline HTTP replay)", "owner": "agent", "status": "todo", "outputs": [{"kind": "single", "path": "docs/failure-taxonomy.md", "exists": false}, {"kind": "single", "path": "pipeline/tests/fixtures/http", "exists": false}], "note": "One fixture and test per class from the experience log and LESSONS.md; the replay switch in run_study.py waits for the Batch session.", "logs": [], "outputs_present": 0, "outputs_total": 2, "status_source": "disk"}, {"id": "8.5", "title": "Mini end-to-end run in CI (2 tiny datasets, Docker, trimmed reference)", "owner": "agent", "status": "todo", "outputs": [{"kind": "single", "path": ".github/workflows/e2e.yml", "exists": false}], "note": "Paired-end MiSeq and reversed 454 subsets; checks integrity, QC verdict and metric snapshots with tolerance.", "logs": [], "outputs_present": 0, "outputs_total": 1, "status_source": "disk"}, {"id": "8.6", "title": "Mock community and expected-findings checks", "owner": "agent + human", "status": "todo", "note": "ZymoBIOMICS dataset still to be chosen; run on every ampliseq, SILVA or parameter change.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}, {"id": "8.7", "title": "Data CI for new studies and first-pass success metric", "owner": "agent", "status": "todo", "outputs": [{"kind": "single", "path": "pipeline/bin/validate_study.py", "exists": false}, {"kind": "single", "path": "docs/onboarding-metrics.csv", "exists": false}], "note": "Schema and count checks, preflight replay, robust z-score drift against earlier studies.", "logs": [], "outputs_present": 0, "outputs_total": 2, "status_source": "disk"}, {"id": "8.8", "title": "Agent extraction eval (replay of stored LLM responses)", "owner": "agent", "status": "todo", "note": "Gold set = the 5 curated studies; live-model eval only on manual trigger once the owner sets a key and budget.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}, {"id": "8.9", "title": "CD: git sha provenance, run image, Workload Identity Federation", "owner": "agent + human", "status": "todo", "note": "Waits for the Google Batch work; no service account keys; terraform apply by the owner.", "outputs": [], "logs": [], "outputs_present": 0, "outputs_total": 0, "status_source": "declared"}]}], "needs_you": [{"title": "Look at two QC 'review' verdicts", "detail": "35756051: median quality-filter retention 38%, 42 of 89 runs keep <20% of reads (MiSeq 2x301, trunclen 281/178) - accept, or adjust truncation/maxEE for this study? 28174747: flagged only because the length check expects the full ~253 nt V4 amplicon while the reads are 1x101; likely a QC rule to fix, not a data problem. Details in studies/<PMID>/pipeline_qc.json.", "blocks": "Phase 6 ML input choices"}, {"title": "Claim the AI Pro $10/month Cloud credit", "detail": "On the Developer Program Benefits page, claim it to the Free Trial billing account without upgrading the free trial; if it asks you to upgrade first, stop and tell the agent. Then check Console > Billing > Credits that its scope includes Compute Engine.", "blocks": "nothing yet (the $300 trial covers the first runs)"}, {"title": "Review the schema design draft v0.2", "detail": "Open schema-design.html: read 'What changed from v0.1' and 'Tested against five real studies', comment on tables and fields, answer the open questions (Q10 is for later), then paste the Feedback Markdown into the chat.", "blocks": "Phase 1 SQL (tasks 1.2–1.5)"}, {"title": "Initialize git and the public GitHub repo", "detail": "The folder is not a git repository yet. .gitignore currently lists only .env; add phase0/data/raw (cached API responses and paper full text) before the first commit.", "blocks": "commit history; CI/CD (Phase 8)"}, {"title": "Choose a license", "detail": "proj.md says: to be decided.", "blocks": "public release"}, {"title": "Approve the first commit and the private GitHub repo", "detail": "Decided 2026-11-16: private now, public later. Still open: confirm paper-discover2sra stays a separate repo, then approve the first commit, creating the private repo and pushing.", "blocks": "Phase 8 tasks 8.1 and 8.3"}], "decisions": [{"date": "2026-11-15", "text": "Smoke run 35756051 left as is: maxEE stays at ampliseq's default (2/2); the review verdict for SRR15400843 (3% kept in quality filtering) stands and is revisited at the full run."}, {"date": "2026-11-15", "text": "On osx-arm64 conda, ampliseq runs with skip_phyloseq, skip_tse and skip_report (their environments don't solve or break), a python=3.8.20 override for the Cutadapt summary, and mamba --override-channels so no package comes from Anaconda's commercial defaults channel."}, {"date": "2026-11-14", "text": "No Docker for the pipeline on the M4 Mac mini (16 GB): nf-core steps run in native osx-arm64 conda environments (-profile mamba), cached in DATA_DIR/conda. Docker or Singularity remain the profile for a Linux server."}, {"date": "2026-11-15", "text": "Raw FASTQ is deleted once a run is processed and its results are loaded and checked (enforced by a CHECK on core.run); failed runs keep their FASTQ. The bioinformatics workflow is built in a separate session against the contract in db/README.md."}, {"date": "2026-11-14", "text": "Phase 3 is built on files: samplesheets from studies/<PMID>, results as TSVs shaped like the draft bio.* tables; loading into PostgreSQL waits for Phase 1."}, {"date": "2026-11-14", "text": "Taxonomy: SILVA only (DADA2 assignTaxonomy, silva=144 in ampliseq 3.1.0); GTDB can be added later as extra taxonomy_assignment rows."}, {"date": "2026-11-14", "text": "Pinned: Nextflow 26.10.6, nf-core/ampliseq 3.1.0, nf-core/fetchngs 1.13.0. QIIME2 steps skipped; exclude_taxa none (store everything, filter in analysis views)."}, {"date": "2026-11-14", "text": "Raw FASTQ is deleted automatically after processing, as soon as collect's integrity checks pass (not gated on the QC verdict); manifest.tsv keeps URL and md5 to fetch it again. Nextflow cleanup=true empties work/ after each successful run."}, {"date": "2026-11-14", "text": "Full runs on all five curated studies are deferred; only a 6-run smoke run of 35756051."}, {"date": "2026-11-15", "text": "Raw FASTQ is not kept: the workflow downloads per study, verifies MD5, processes, loads ASV/count tables into PostgreSQL, then deletes the FASTQ (run.download_state=deleted; fastq_urls and fastq_md5 allow re-fetching). Reason: about 46 GB free on the Mac versus an estimated 1.2-2 TB of FASTQ for all 47.5k IBD amplicon runs."}, {"date": "2026-11-15", "text": "Database stores facts with provenance, not analysis decisions: every subject/sample/run value is a row in core.observation (conflicts kept), long-tail fields go through a field dictionary and are promoted to columns when common, and case/control is decided only in versioned analysis.cohort_definition rules."}, {"date": "2026-11-15", "text": "Explore before codifying: curate studies one by one with Claude Code agents, logging every attempt per study (studies/<PMID>/log.jsonl), then extend the scripted workflow from what the logs show."}, {"date": "2026-11-11", "text": "Prototype LLM calls go through the Claude Code CLI with Haiku (claude -p), on the owner's Claude login; Gemini CLI stays available as an option."}, {"date": "2026-11-11", "text": "No Docker while prototyping: use a natively installed PostgreSQL. Docker Compose is added as packaging in Phase 6."}, {"date": "2026-11-10", "text": "Prototype orchestration with Claude Code subagents first, then port to LangGraph for traceability."}, {"date": "2026-11-10", "text": "Nextflow (on nf-core/ampliseq) for bioinformatics; PostgreSQL with JSONB raw layer; Streamlit for the dashboard."}, {"date": "2026-11-10", "text": "Disease is chosen by data availability, not in advance; it may be a gut disease."}, {"date": "2026-11-10", "text": "Cross-region batch-effect analysis is deferred, but the schema stores every technical covariate from day one."}, {"date": "2026-11-11", "text": "Target disease: inflammatory bowel disease (Crohn's + ulcerative colitis). Runner-up: periodontitis, with colorectal cancer about tied. Phase 0 is a quick heuristic, not a full survey (see phase0/REPORT.md)."}, {"date": "2026-11-15", "text": "454 study 23013615 gets no special handling: it goes through the production pipeline like any study, and preflight holds it as needs_review (quality scores replaced, 2 distinct values). Kept as demo story 1 in docs/demo-stories.md for a job talk / LinkedIn post on data heterogeneity."}, {"date": "2026-11-15", "text": "LLM (Haiku) triage of pipeline failures and an ops.pipeline_issue table are deferred to save tokens; recorded as open question Q10 in schema-design.html."}, {"date": "2026-11-15", "text": "Process 23013615 after all: when preflight finds lost quality scores, the pipeline gets the run's full normalized .sra from NCBI (AWS Open Data, md5-checked) instead of ENA's FASTQ; a general rule, not a one-study fix. Results go into PostgreSQL via db/load_bio.py before FASTQ deletion."}, {"date": "2026-11-15", "text": "sra-tools comes from a project conda env (DATA_DIR/conda/sra-tools, bioconda), not Homebrew; sra_source.py finds fastq-dump there when it is not on PATH."}, {"date": "2026-11-15", "text": "454 / Ion Torrent single-end reads get a fixed trunclenf (length 75 % of reads reach, capped where median quality drops below 25): ampliseq's truncLen = 0 split one organism into ASVs of many lengths."}, {"date": "2026-11-15", "text": "DADA2 addSpecies chunk size is computed from the memory cap and measured cost (peak ~ refs x (3430 + 23.3 x n) bytes; n = 70 at 8 GB) instead of ampliseq's n = 1e5; n = 1e5 and n = 200 both hit R's 16 GB limit on 2000 same-length ASVs x 1.47M SILVA species refs."}, {"date": "2026-11-15", "text": "GCP worker uses on-demand VMs, not Spot: Google's standard credit exclusions list Preemptible and Spot offerings, and the AI Pro credit ($10/month, 12-month validity) is the budget. Data disk 100 GB and deleted between batches."}, {"date": "2026-11-15", "text": "Nextflow process.cache = 'lenient' (path + size) in conf/local_mac.config: ampliseq's RENAME_RAW_DATA_FILES touches single-end FASTQ through the symlink, so the default mtime-based cache key made every -resume rerun everything."}, {"date": "2026-11-15", "text": "Owner asked for an experience log of pipeline failures with resource numbers for scale-up and GCP sizing: docs/experience-log.md (interpretation) plus studies/<PMID>/resource_profile.json written by the pipeline for every Nextflow run, failed runs included."}, {"date": "2026-11-15", "text": "Owner took the $300 / 90-day Google Cloud free trial. Rule: if the card is charged more than $1 (net cost after all credits), stop everything. Guard 1: never upgrade the trial account. Guard 2: a $1 budget on net cost -> Pub/Sub -> Cloud Run function that unlinks billing from the project (docs/gcp-migration.md 5.4b), applied before the worker."}, {"date": "2026-11-15", "text": "Kill switch live on agentic-16s-gcp: budget on net cost after credits at $1 -> Pub/Sub -> Cloud Run function (Project Billing Manager only) unlinks billing; verified end to end with a fake over-budget message."}, {"date": "2026-11-15", "text": "All gcloud commands for this project go through infra/gcloud16s: config in ~/.config/gcloud-agentic16s, credentials from the ADC file Terraform uses. Cause: Antigravity's Google extension (signed in as another Google account) calls gcloud config config-helper with its own credential file after every change in ~/.config/gcloud, and gcloud then stores that credential under the active account."}, {"date": "2026-11-15", "text": "GCE smoke test passed: Linux/Docker and Mac/conda give identical counts and ASVs for 35756051 subset 6; taxonomy bootstrap differs for 7 rare ASVs. NF_PROFILE may now be set by environment variable, so one checkout serves both platforms. Next GCE use: full runs (3.2b) on e2-standard-8."}, {"date": "2026-11-15", "text": "DADA2 sample_inference = pseudo for every study from now on (preflight FIXED_PARAMS), owner's decision: the project is an MVP/demo whose goal is a database that separates disease from healthy, and ampliseq's default pooled mode took about 1 h 45 min per read direction on 37661264 using 3 of 8 vCPUs. Studies already run pooled (23013615, 29335008, 37661264) are not rerun; the batch difference is accepted."}, {"date": "2026-11-16", "text": "skip_dada_addspecies = true for every new study (preflight FIXED_PARAMS), owner's decision: species assignment was the slowest step of the GCE batch (single-threaded, 15-16 GB per 2000-ASV chunk, ~45 min each, could not run in parallel on 32 GB; ~5 h for 37661264), and genus level is enough for disease vs healthy. The five studies already processed keep their species columns."}, {"date": "2026-11-16", "text": "Phase 6.1 model setup: genus level (no ASV is shared between studies), min 1000 non-chimeric reads, genera present in >= 3 training studies chosen inside each fold, CLR with pseudocount 0.5, L2 logistic regression + random forest, leave-one-study-out as the main score, within-study grouped CV and a 100x label-permutation baseline as references. Main cohort ibd_vs_healthy_broad; stool-only as a supplementary run."}, {"date": "2026-11-16", "text": "Google Batch (owner's request: portfolio value, and no VM to manage): one Batch job per study running the existing run_study.py on Docker, not Nextflow's per-task google-batch executor. Reasons from the recorded lessons: a study has ~4 tasks per run, most of them seconds long, so a VM per task would spend its time booting; the integrity checks, the ENA->NCBI fallback and the resource sampler need local files; and a fixed code snapshot per job prevents E13 (a fix that did not reach a running process). The GCE worker stays, off, as fallback."}, {"date": "2026-11-16", "text": "CI/CD 8.2: Python dependencies pinned in uv.lock (groups dev, db, ml, dashboard; pipeline/bin and infra stay standard-library only). scripts/check.sh is the single check entry point that CI will run. The standard-library code is checked on Python 3.9 (Mac system Python) and 3.12 (GCE VM); add Google Batch's Debian Python once its probe has run. Lint starts with bug rules only (ruff E4/E7/E9/F)."}, {"date": "2026-11-16", "text": "GitHub repo is private for now and will be made public later (owner). So the whole git history must be safe to publish from the first commit: no emails, billing IDs or keys; docs/gcp-handoff.md stays local (gitignored); paper-discover2sra stays its own private repo for now. Private runners are smaller (about 2 vCPU / 7 GB) with about 2000 free minutes a month, so the mini end-to-end run (8.5) runs weekly and on pipeline changes, not nightly, and uses a trimmed reference."}], "metrics": {"ibd": {"epmc_n": 1462, "epmc_open_access": 824, "epmc_has_fulltext_in_epmc": 943, "epmc_acc_annot_bioproject": 159, "epmc_acc_annot_any_seq_archive": 293, "epmc_oa_and_acc_annot_bioproject": 150, "epmc_broad_n": 5484, "epmc_broad_open_access": 2929, "pubmed_n": 1436, "pubmed_pmc_open_access": 911, "pubmed_free_full_text": 1111, "pubmed_si_bioproject_or_sra": 17, "pubmed_pubmed_sra_link_filter": 39, "pubmed_associated_data_filter": 319, "pubmed_broad_n": 5585, "runs_strict_human": 36549, "bioprojects_strict_human": 229, "bioprojects_strict_ge50_runs": 140, "top_platform": "Illumina MiSeq", "top_platform_frac": 0.664, "label_projects_checked": 20, "label_projects_case_ctrl": 5}, "crc": {"epmc_n": 838, "epmc_open_access": 550, "epmc_has_fulltext_in_epmc": 618, "epmc_acc_annot_bioproject": 112, "epmc_acc_annot_any_seq_archive": 208, "epmc_oa_and_acc_annot_bioproject": 103, "epmc_broad_n": 2920, "epmc_broad_ope _link_filter": 4, "pubmed_associated_data_filter": 83, "pubmed_broad_n": 722}, "obesity": {}, "parkinson": {}, "ibs": {}}, "recent": [{"path": "progress/plan.json", "mtime": 1794873503, "size": 42161}, {"path": "scripts/check.sh", "mtime": 1794873430, "size": 3952}, {"path": "uv.lock", "mtime": 1794873319, "size": 752950}, {"path": "pyproject.toml", "mtime": 1794873319, "size": 1822}, {"path": "CLAUDE.md", "mtime": 1794873122, "size": 2825}, {"path": "docs/cicd-cloud-overview.html", "mtime": 1794873122, "size": 37446}, {"path": "docs/ci-cd-plan.md", "mtime": 1794873122, "size": 18793}, {"path": "db/load_study.py", "mtime": 1794873060, "size": 38171}, {"path": "pipeline/bin/run_study.py", "mtime": 1794873056, "size": 26097}, {"path": "progress/build.py", "mtime": 1794873056, "size": 7413}, {"path": "infra/batch_submit.py", "mtime": 1794870132, "size": 24555}, {"path": "infra/batch.tf", "mtime": 1794870132, "size": 3124}, {"path": "pipeline/tests/test_batch.py", "mtime": 1794870090, "size": 6847}, {"path": "pipeline/bin/compare_tables.py", "mtime": 1794869909, "size": 5289}]};/*DATA-END*/</script>
<script>
(function () {
  var D = window.PROGRESS;
  if (!D) return;
  var STATUS = { done: "Done", in_progress: "In progress", todo: "Not started", blocked: "Blocked", needs_human: "Needs you" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function href(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function size(n) { if (n == null) return ""; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(0) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }
  function ago(t) {
    var s = Math.max(0, Date.now() / 1000 - t);
    if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago";
  }
  function n(v) { return v == null ? null : Number(v).toLocaleString("en-US"); }
  function chip(st) { return '<span class="chip s-' + esc(st) + '">' + esc(STATUS[st] || st) + "</span>"; }
  function fileLink(f, label) {
    var name = esc(label || f.path);
    if (!f.exists) return '<span class="f missing" title="not on disk yet">' + name + "</span>";
    return '<a class="f ok" href="' + href(f.path) + '">' + name + '</a> <span class="fmeta">' + (f.is_dir ? "" : size(f.size) + " · ") + ago(f.mtime) + "</span>";
  }
  function outputRow(kind, o) {
    if (o.kind === "single") return '<div class="frow"><span class="k">' + kind + "</span>" + fileLink(o) + "</div>";
    var have = o.items.filter(function (i) { return i.exists; }).length;
    var set = o.items.map(function (i) {
      return i.exists ? '<a href="' + href(i.path) + '" title="' + esc(i.path) + " · " + size(i.size) + " · " + ago(i.mtime) + '">' + esc(i.d) + "</a>"
                      : '<span title="' + esc(i.path) + ' — not on disk yet">' + esc(i.d) + "</span>";
    }).join("");
    return '<div class="frow"><span class="k">' + kind + '</span><span class="f">' + esc(o.pattern.replace("{d}", "<disease>")) +
      '</span><span class="fmeta num">' + have + "/" + o.items.length + '</span><span class="dset">' + set + "</span></div>";
  }

  var tasks = []; D.phases.forEach(function (p) { p.tasks.forEach(function (t) { tasks.push(t); }); });
  var done = tasks.filter(function (t) { return t.status === "done"; }).length;
  var running = tasks.filter(function (t) { return t.running; });
  var current = D.phases.filter(function (p) { return p.tasks.some(function (t) { return t.status !== "done"; }); })[0] || D.phases[D.phases.length - 1];
  var ageMin = (Date.now() / 1000 - D.built_at) / 60;

  var h = "";
  h += '<header class="top"><div class="t"><div class="eyebrow">Plan &amp; progress</div><h1>' + esc(D.project) + "</h1><p>" + esc(D.tagline) +
       ' · <a href="proj.md">proj.md</a></p></div><div class="built"><span class="' + (ageMin > 10 ? "stale" : "") + '">Snapshot ' + esc(D.built_at_text) +
       " (" + ago(D.built_at) + ')</span><button class="btn" id="auto" aria-pressed="false" title="Reload this page every 30 s. Pair with: python3 progress/build.py --watch 30">Auto-refresh</button></div></header>';

  h += '<div class="tiles">' +
    '<div class="tile"><div class="eyebrow">Current phase</div><b>' + esc(current.id) + "</b><span>" + esc(current.title) + "</span></div>" +
    '<div class="tile"><div class="eyebrow">Tasks done</div><b class="num">' + done + " / " + tasks.length + "</b><span>across " + D.phases.length + " phases</span></div>" +
    '<div class="tile"><div class="eyebrow">Running now</div><b class="num">' + running.length + "</b><span>" +
      (running.length ? esc(running.map(function (t) { return t.id; }).join(", ")) + " at snapshot time" : "no pipeline script active") + "</span></div>" +
    '<div class="tile"><div class="eyebrow">Needs you</div><b class="num">' + D.needs_you.length + "</b><span>open decisions or actions</span></div></div>";

  h += '<section><h2>Roadmap</h2><div class="rail">' + D.phases.map(function (p) {
    var d = p.tasks.filter(function (t) { return t.status === "done"; }).length;
    var ip = p.tasks.filter(function (t) { return t.status === "in_progress"; }).length;
    var tot = p.tasks.length || 1;
    return '<a href="#' + esc(p.id) + '" class="' + (p === current ? "current" : "") + '"><div class="pid">' + esc(p.id) + '</div><div class="pt">' + esc(p.title) +
      '</div><div class="bar"><i class="d" style="width:' + (100 * d / tot) + '%"></i><i class="p" style="width:' + (100 * ip / tot) + '%"></i></div><div class="frac num">' +
      d + "/" + p.tasks.length + " done" + (ip ? " · " + ip + " in progress" : "") + "</div></a>";
  }).join("") + "</div></section>";

  if (D.needs_you.length) {
    h += '<section><h2>Needs you</h2><div class="card"><ul class="needs">' + D.needs_you.map(function (x) {
      return "<li><b>" + esc(x.title) + "</b>" + (x.blocks ? ' <span class="tag">blocks ' + esc(x.blocks) + "</span>" : "") + "<p>" + esc(x.detail || "") + "</p></li>";
    }).join("") + "</ul></div></section>";
  }

  h += "<section><h2>Phases and tasks</h2>" + D.phases.map(function (p) {
    var d = p.tasks.filter(function (t) { return t.status === "done"; }).length;
    var any = p.tasks.some(function (t) { return t.status === "in_progress" || t.running; });
    var st = d === p.tasks.length && p.tasks.length ? "done" : (d || any ? "in_progress" : "todo");
    var body = '<p class="goal">' + esc(p.goal) + "</p>";
    if (p.links && p.links.length) body += '<div class="plinks">' + p.links.map(function (l) { return fileLink(l, l.label); }).join("") + "</div>";
    body += p.tasks.map(function (t) {
      var rows = "";
      if (t.script_file) rows += '<div class="frow"><span class="k">script</span>' + fileLink(t.script_file) + "</div>";
      (t.outputs || []).forEach(function (o) { rows += outputRow("output", o); });
      (t.logs || []).forEach(function (o) { rows += outputRow("log", o); });
      return '<div class="task"><div class="tid">' + esc(t.id) + '</div><div><div class="head"><b>' + esc(t.title) + "</b>" + chip(t.status) +
        (t.running ? '<span class="chip live">running now</span>' : "") +
        '<span class="tag">' + esc(t.owner || "") + "</span>" +
        (t.status_source === "disk" ? '<span class="tag" title="Status derived from which outputs exist on disk">' + t.outputs_present + "/" + t.outputs_total + " outputs on disk</span>"
                                    : '<span class="tag" title="Status as written in progress/plan.json; not checked against disk">declared</span>') +
        "</div>" + (t.note ? '<p class="note">' + esc(t.note) + "</p>" : "") + (rows ? '<div class="files">' + rows + "</div>" : "") + "</div></div>";
    }).join("");
    return '<details class="phase card" id="' + esc(p.id) + '"' + (p === current ? " open" : "") + '><summary><span class="pid">' + esc(p.id) + "</span><h3>" + esc(p.title) +
      "</h3>" + chip(st) + '<span class="fmeta num">' + d + "/" + p.tasks.length + '</span></summary><div class="phase-body">' + body + "</div></details>";
  }).join("") + "</section>";

  var cols = [
    ["epmc_n", "Papers, Europe PMC (16S query)"], ["epmc_open_access", "of which open access"],
    ["epmc_oa_and_acc_annot_bioproject", "OA + BioProject cited"], ["runs_strict_human", "SRA amplicon runs (human)"],
    ["bioprojects_strict_human", "BioProjects"], ["bioprojects_strict_ge50_runs", "BioProjects ≥ 50 runs"]
  ];
  h += '<section><h2>Phase 0 scoreboard</h2><div class="card"><div class="scroll"><table><thead><tr><th>Candidate disease</th>' +
    cols.map(function (c) { return "<th>" + esc(c[1]) + "</th>"; }).join("") + "<th>Top platform</th><th>Projects with case + control label</th></tr></thead><tbody>" +
    D.diseases.map(function (d) {
      var m = D.metrics[d.key] || {};
      var cells = cols.map(function (c) { var v = n(m[c[0]]); return v == null ? '<td class="dash">—</td>' : '<td class="num">' + v + "</td>"; }).join("");
      cells += m.top_platform ? '<td class="num">' + esc(m.top_platform.replace("Illumina ", "")) + " " + Math.round(m.top_platform_frac * 100) + "%</td>" : '<td class="dash">—</td>';
      cells += m.label_projects_checked != null ? '<td class="num">' + m.label_projects_case_ctrl + " of " + m.label_projects_checked + " sampled</td>" : '<td class="dash">—</td>';
      return "<tr><td>" + esc(d.name) + ' <span class="mono muted">' + esc(d.key) + "</span></td>" + cells + "</tr>";
    }).join("") + '</tbody></table></div><div class="legend">— means that step has not produced a number for that disease yet. ' +
    "Label column is the automatic heuristic from task 0.4, before the manual review in task 0.5.</div></div></section>";

  h += '<section class="two"><div><h2 style="margin-bottom:12px">Recently changed files</h2><div class="card"><ul class="list">' +
    D.recent.map(function (f) {
      return '<li><span class="when">' + ago(f.mtime) + '</span><a class="grow mono" href="' + href(f.path) + '">' + esc(f.path) + '</a><span class="fmeta">' + size(f.size) + "</span></li>";
    }).join("") + '</ul></div></div><div><h2 style="margin-bottom:12px">Decisions</h2><div class="card"><ul class="list">' +
    D.decisions.map(function (x) { return '<li><span class="when">' + esc(x.date) + '</span><span class="grow">' + esc(x.text) + "</span></li>"; }).join("") +
    "</ul></div></div></section>";

  h += "<footer><p>This page is a snapshot. Refresh it with <code>python3 progress/build.py</code>, or keep it live with <code>python3 progress/build.py --watch 30</code> and the Auto-refresh button.</p>" +
    "<p>Plan, statuses, decisions and “needs you” items live in <a href=\"progress/plan.json\">progress/plan.json</a>. Tasks marked “outputs on disk” are checked against the filesystem; tasks marked “declared” are not.</p></footer>";

  document.getElementById("app").innerHTML = h;

  var KEY = "plan-progress-auto", timer = null, btn = document.getElementById("auto");
  function setAuto(on) {
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    clearTimeout(timer);
    if (on) timer = setTimeout(function () { location.reload(); }, 30000);
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
  }
  btn.addEventListener("click", function () { setAuto(btn.getAttribute("aria-pressed") !== "true"); });
  var saved = "0"; try { saved = localStorage.getItem(KEY) || "0"; } catch (e) {}
  setAuto(saved === "1");
})();
</script>
